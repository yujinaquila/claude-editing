name: Fix AI tools without Anthropic billing
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- CLIPFORGE-NO-ANTHROPIC-FIX-V1 -->'
          if marker not in s:
              patch=r'''<!-- CLIPFORGE-NO-ANTHROPIC-FIX-V1 -->
          <script>
          (()=>{
            const esc=v=>typeof escapeHtml==='function'?escapeHtml(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            const sources=()=>{
              if(Array.isArray(media)&&media.length)return media.filter(x=>x&&x.url);
              if(Array.isArray(timeline)&&timeline.length)return timeline.map(c=>typeof getMediaForTimelineClip==='function'?(getMediaForTimelineClip(c)||c):c).filter(x=>x&&x.url);
              return [];
            };
            const rank=(list,hook=false)=>list.map((m,i)=>{
              const hs=Array.isArray(m.highlights)?m.highlights.reduce((n,h)=>n+Math.max(0,(Number(h.end)||0)-(Number(h.start)||0)),0):0;
              const tr=Array.isArray(m.transcript)?m.transcript.length:0;
              const dur=Number(m.duration)||0;
              const opening=hook?Math.max(0,12-Math.abs(dur-8)):Math.min(12,dur);
              return {m,i,score:hs*5+Math.min(20,tr)*.35+opening};
            }).sort((a,b)=>b.score-a.score);
            const resultBox=(title,items,top)=>{
              const el=document.getElementById('resultsBody');
              if(!el)return;
              if(typeof clearEmptyRight==='function')clearEmptyRight();
              const card=document.createElement('div');card.className='result-card';
              card.innerHTML='<h4>'+esc(title)+'</h4>'+items.slice(0,8).map((x,n)=>'<div style="padding:7px 0;border-top:1px solid var(--border)"><b>'+(n+1)+'. '+esc(x.m.name||'Clip')+'</b><div style="color:var(--muted);font-size:11px;margin-top:2px">'+esc(x.reason||'Detected strong speech, highlights, and usable duration.')+'</div></div>').join('')+(top?'<div style="margin-top:8px;color:var(--ok);font-weight:600">Top pick: '+esc(top.m.name)+'</div>':'');
              el.prepend(card);
            };
            window.runAutoHook=async()=>{
              const list=sources();if(!list.length){if(typeof showToast==='function')showToast('Import video clips first');return;}
              const r=rank(list,true);resultBox('Auto Hook — local analysis',r.map(x=>({...x,reason:'Best opening candidate from detected highlights, speech, and short-form timing.'})),r[0]);
              if(r[0]){
                const m=r[0].m;
                if(Array.isArray(timeline)&&timeline.length){const c=timeline.find(c=>c.mediaId===m.id);if(c&&typeof loadSeqClip==='function')loadSeqClip(c);}
              }
              if(typeof showToast==='function')showToast('Auto Hook created without Anthropic');
            };
            window.runSceneChoose=async()=>{
              const list=sources();if(!list.length){if(typeof showToast==='function')showToast('Import video clips first');return;}
              const r=rank(list,false);resultBox('Best Scenes — local analysis',r.map(x=>({...x,reason:'Detected strong highlights, speech, and usable scene duration.'})),r[0]);
              if(typeof showToast==='function')showToast('Best Scenes created without Anthropic');
            };
            const parsePrompt=(text,list)=>{
              const t=text.toLowerCase();
              let r=rank(list,/(hook|opening|intro|start strong|best moment)/.test(t));
              if(/chronological|original order|in order/.test(t))r=list.map((m,i)=>({m,i,score:0}));
              if(/random/.test(t))r=[...r].sort(()=>Math.random()-.5);
              const n=(t.match(/\b(\d+)\s*(?:clips?|scenes?|videos?)\b/)||[])[1];
              if(n)r=r.slice(0,Math.max(1,Math.min(Number(n),list.length)));
              return r;
            };
            window.runPromptEdit=async()=>{
              const input=document.getElementById('promptInput');const btn=document.getElementById('promptRunBtn');const prompt=(input?.value||'').trim();
              if(!prompt){if(typeof showToast==='function')showToast('Write a prompt first');return;}
              const list=sources();if(!list.length){if(typeof showToast==='function')showToast('Import video clips first');return;}
              if(btn)btn.disabled=true;
              try{
                const r=parsePrompt(prompt,list);
                if(!Array.isArray(timeline))timeline=[];
                const ordered=r.map(x=>x.m);
                const newTimeline=[];
                ordered.forEach(m=>{const c=timeline.find(c=>c.mediaId===m.id);if(c&&!newTimeline.includes(c))newTimeline.push(c);else if(!c)newTimeline.push({id:'t'+Date.now()+Math.random().toString(36).slice(2),mediaId:m.id,name:m.name,url:m.url,duration:m.duration,trimIn:0,trimOut:m.duration,highlights:m.highlights||[]});});
                timeline=newTimeline;
                if(typeof renderTimeline==='function')renderTimeline();
                const el=document.getElementById('resultsBody');if(el){if(typeof clearEmptyRight==='function')clearEmptyRight();const card=document.createElement('div');card.className='result-card';card.innerHTML='<h4>Prompt Edit — local engine</h4><div>'+esc('Applied your prompt using detected clips, highlights, durations, and ordering rules. No Anthropic API call was made.')+'</div><div style="margin-top:8px;color:var(--muted);font-size:11px">'+ordered.length+' clip(s) arranged on the timeline.</div><button class="apply-btn" onclick="playSequence()">▶ Preview edit</button>';el.prepend(card);}
                if(typeof showToast==='function')showToast('Prompt edit applied without Anthropic');
              }catch(e){console.error(e);if(typeof showToast==='function')showToast('Could not build the local edit');}
              finally{if(btn)btn.disabled=false;}
            };
            document.addEventListener('click',e=>{
              const b=e.target.closest?.('button');if(!b)return;
              const txt=(b.textContent||'').trim().toLowerCase();
              if(txt.includes('auto hook')){e.preventDefault();e.stopImmediatePropagation();window.runAutoHook();return;}
              if(txt.includes('best scene')){e.preventDefault();e.stopImmediatePropagation();window.runSceneChoose();return;}
              if(txt.includes('prompt')&&(/edit|run|apply/.test(txt))){e.preventDefault();e.stopImmediatePropagation();window.runPromptEdit();return;}
            },true);
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>')
          s=s.replace('AI is building the edit…','Building edit locally…').replace('AI sedang menyusun edit…','Menyusun edit secara lokal…')
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-ai-tools.yml 2>/dev/null || true
          git rm -f .github/workflows/fix-no-anthropic.yml 2>/dev/null || true
          git add index.html
          git commit -m "Make AI editing tools work without Anthropic API key"
          git push origin HEAD:main
