<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Claude AI Editor — prompt-driven marketing video editor" />
  <title>Claude AI Editor</title>
  <script>
    // Keep imported video Blob URLs alive for the editor session.
    (() => {
      const originalCreate = URL.createObjectURL.bind(URL);
      const originalRevoke = URL.revokeObjectURL.bind(URL);
      const mediaUrls = new Set();

      URL.createObjectURL = (object) => {
        const url = originalCreate(object);
        if (object instanceof File && /^video\\//i.test(object.type)) mediaUrls.add(url);
        return url;
      };

      URL.revokeObjectURL = (url) => {
        if (mediaUrls.has(url)) return;
        originalRevoke(url);
      };

      window.addEventListener('beforeunload', () => {
        for (const url of mediaUrls) originalRevoke(url);
        mediaUrls.clear();
      });
    })();

    // Speed fix: redirect Whisper Small model requests to the much lighter
    // Whisper Tiny model while keeping transcription local/private.
    (() => {
      const originalFetch = window.fetch.bind(window);
      const SMALL = '/onnx-community/whisper-small/';
      const TINY = '/onnx-community/whisper-tiny/';
      function rewriteUrl(value) {
        try {
          const url = new URL(value, location.href);
          if (url.hostname === 'huggingface.co' && url.pathname.includes(SMALL)) {
            url.pathname = url.pathname.replace(SMALL, TINY);
            return url.toString();
          }
          return value;
        } catch (_) { return value; }
      }
      window.fetch = (input, init) => {
        if (typeof input === 'string' || input instanceof URL) return originalFetch(rewriteUrl(input), init);
        if (input instanceof Request) {
          const rewritten = rewriteUrl(input.url);
          if (rewritten !== input.url) return originalFetch(new Request(rewritten, input), init);
        }
        return originalFetch(input, init);
      };
    })();

    // Import compatibility fix. Some browsers/OS combinations give uploaded
    // video files an empty or generic MIME type. main.js currently filters on
    // file.type, so normalize the MIME type before its change handler runs.
    (() => {
      const MIME = {
        mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime',
        webm: 'video/webm', ogv: 'video/ogg', avi: 'video/x-msvideo',
        mkv: 'video/x-matroska', mpeg: 'video/mpeg', mpg: 'video/mpeg',
        ts: 'video/mp2t', mts: 'video/mp2t', m2ts: 'video/mp2t'
      };
      const extOf = (name) => String(name || '').toLowerCase().split('.').pop();
      document.addEventListener('change', (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.type !== 'file') return;
        const files = Array.from(input.files || []);
        if (!files.length) return;
        const dt = new DataTransfer();
        let changed = false;
        for (const file of files) {
          const ext = extOf(file.name);
          const mime = MIME[ext];
          if (mime && (!file.type || !file.type.startsWith('video/'))) {
            dt.items.add(new File([file], file.name, { type: mime, lastModified: file.lastModified }));
            changed = true;
          } else dt.items.add(file);
        }
        if (changed) input.files = dt.files;
      }, true);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
