<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premiere AI Video Editor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#1e1e1e] text-gray-200 font-sans select-none h-screen flex flex-col overflow-hidden">

  <!-- Top Application Bar -->
  <header class="flex items-center justify-between px-4 py-2 bg-[#141414] border-b border-[#333] relative z-50">
    <div class="flex items-center space-x-4">
      <span class="text-purple-500 font-bold text-lg tracking-wider">PREMIERE AI</span>
      <nav class="flex space-x-3 text-xs text-gray-400">
        <span class="hover:text-white cursor-pointer">File</span>
        <span class="hover:text-white cursor-pointer">Edit</span>
        <span class="hover:text-white cursor-pointer">Sequence</span>
        <span class="hover:text-white cursor-pointer">Graphics</span>
      </nav>
    </div>
    <div class="flex items-center space-x-2">
      <button id="exportBtn" class="flex items-center space-x-1 text-xs bg-[#2a2a2a] hover:bg-[#333] border border-[#444] text-gray-200 px-2.5 py-1.5 rounded">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Export</span>
      </button>
      <button id="runAiBtn" class="flex items-center space-x-1.5 text-xs bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded transition shadow-lg shadow-purple-900/30">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        <span id="aiBtnText">Run AI Script</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left Panel: Media Pool & AI Control -->
    <div class="w-1/3 border-r border-[#333] bg-[#252525] flex flex-col p-3 space-y-4">
      
      <!-- Import Box -->
      <div id="dropZone" class="border-2 border-dashed border-[#444] rounded-lg p-4 text-center hover:border-purple-500 transition cursor-pointer relative bg-[#1e1e1e]">
        <input type="file" id="videoInput" accept="video/*" class="hidden" />
        <i data-lucide="upload" class="w-6 h-6 mx-auto mb-1 text-gray-400"></i>
        <p class="text-xs text-gray-300">Import Video / Drop Media Here</p>
        <p class="text-[10px] text-gray-500">Supports MP4, MOV, WebM</p>
      </div>

      <!-- AI Presets -->
      <div class="flex flex-col space-y-2 bg-[#1e1e1e] p-3 rounded border border-[#333]">
        <label class="text-xs font-semibold text-purple-400 flex items-center space-x-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>AI Prompt & Presets (EN / ID)</span>
        </label>
        
        <select id="presetSelect" class="bg-[#2a2a2a] border border-[#444] text-xs text-gray-200 rounded p-1.5 focus:outline-none focus:border-purple-500">
          <option value="">-- Choose Preset Template --</option>
          <option value="hook_en">[EN] TikTok / Reels Viral Hook</option>
          <option value="hook_id">[ID] TikTok / Reels Hook Viral</option>
          <option value="autocut_en">[EN] Full Marketing Auto-Cut</option>
          <option value="autocut_id">[ID] Potong Otomatis Pemasaran</option>
        </select>

        <textarea id="promptText" rows="3" placeholder="e.g., Cut silences, extract hook, generate subtitle in Bahasa Indonesia..." class="bg-[#2a2a2a] border border-[#444] text-xs p-2 rounded text-gray-200 focus:outline-none focus:border-purple-500 resize-none"></textarea>
      </div>

      <!-- Subtitles List -->
      <div class="flex-1 bg-[#1e1e1e] border border-[#333] rounded p-2 overflow-y-auto">
        <h4 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center space-x-1">
          <i data-lucide="subtitles" class="w-3 h-3"></i>
          <span>Generated Subtitles & Scenes</span>
        </h4>
        <div id="subtitlesList" class="space-y-1">
          <p class="text-[10px] text-gray-500 italic">No AI captions generated yet.</p>
        </div>
      </div>
    </div>

    <!-- Center Panel: Program Monitor -->
    <div class="flex-1 flex flex-col bg-[#141414]">
      <div class="flex-1 flex items-center justify-center p-4 relative">
        <div id="monitorContainer" class="hidden max-h-full max-w-full aspect-video relative flex items-center justify-center">
          <video id="mainVideo" class="w-full h-full rounded border border-[#333] object-contain bg-black"></video>
          
          <!-- Live On-Screen Subtitle Overlay -->
          <div id="subtitleOverlay" class="absolute bottom-8 left-1/2 -translate-x-1/2 text-center pointer-events-none px-4 py-1 rounded bg-black/75 text-yellow-300 font-bold text-sm border border-yellow-500/30 shadow-lg transition-opacity duration-200 opacity-0"></div>
        </div>

        <div id="emptyMonitor" class="text-center text-gray-600">
          <i data-lucide="video" class="w-12 h-12 mx-auto mb-2 opacity-30"></i>
          <p class="text-xs">No media loaded in monitor</p>
        </div>

        <!-- Status Overlay -->
        <div id="statusOverlay" class="hidden absolute bottom-6 bg-purple-900/90 text-purple-100 text-xs px-3 py-1 rounded backdrop-blur border border-purple-500 z-50 max-w-md text-center"></div>
      </div>

      <!-- Transport Controls -->
      <div class="h-10 bg-[#1e1e1e] border-t border-[#333] flex items-center justify-between px-4">
        <div class="flex items-center space-x-2">
          <button id="playBtn" class="p-1 hover:bg-[#333] rounded text-gray-300">
            <i data-lucide="play" class="w-4 h-4"></i>
          </button>
        </div>
        <span id="timecode" class="text-[11px] font-mono text-gray-400">00:00:00:00</span>
      </div>
    </div>
  </div>

  <!-- Bottom Panel: Timeline -->
  <div class="h-48 border-t border-[#333] bg-[#181818] flex flex-col">
    <div class="h-6 bg-[#222] border-b border-[#333] flex items-center px-3 text-[10px] text-gray-400 space-x-2">
      <i data-lucide="layers" class="w-3 h-3"></i>
      <span>TIMELINE TRACKS (V1 / A1)</span>
    </div>
    
    <div class="flex-1 p-2 space-y-2 overflow-x-auto">
      <div class="h-10 bg-[#262626] border border-[#3a3a3a] rounded flex items-center px-2 relative">
        <span class="text-[10px] text-blue-400 font-bold mr-2">V1</span>
        <div id="videoTrackLabel" class="hidden h-7 bg-blue-900/60 border border-blue-500 rounded flex-1 flex items-center px-2 text-[10px] text-blue-200"></div>
      </div>

      <div class="h-10 bg-[#262626] border border-[#3a3a3a] rounded flex items-center px-2 relative">
        <span class="text-[10px] text-green-400 font-bold mr-2">A1</span>
        <div id="audioTrackLabel" class="hidden h-7 bg-green-900/60 border border-green-500 rounded flex-1 flex items-center px-2 text-[10px] text-green-200"></div>
      </div>
    </div>
  </div>

  <!-- Client JavaScript Logic -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    lucide.createIcons();

    let currentFile = null;
    let currentVideoUrl = null;
    let generatedSubtitles = [];

    const PROMPT_PRESETS = {
      hook_en: "Auto-detect the most engaging 3-second opening scene. Cut all silence over 0.4s. Burn dynamic yellow subtitles in the center.",
      hook_id: "Deteksi adegan 3 detik pertama yang paling menarik. Hapus keheningan di atas 0.4 detik. Buat teks otomatis warna kuning di tengah.",
      autocut_en: "Remove all pause gaps, generate English captions, and format aspect ratio to 9:16 vertical video.",
      autocut_id: "Hapus bagian diam, buat subtitle Bahasa Indonesia, dan ubah rasio video menjadi 9:16 vertikal."
    };

    const dropZone = document.getElementById('dropZone');
    const videoInput = document.getElementById('videoInput');
    const mainVideo = document.getElementById('mainVideo');
    const monitorContainer = document.getElementById('monitorContainer');
    const emptyMonitor = document.getElementById('emptyMonitor');
    const playBtn = document.getElementById('playBtn');
    const timecode = document.getElementById('timecode');
    const statusOverlay = document.getElementById('statusOverlay');
    const runAiBtn = document.getElementById('runAiBtn');
    const exportBtn = document.getElementById('exportBtn');
    const subtitlesList = document.getElementById('subtitlesList');
    const videoTrackLabel = document.getElementById('videoTrackLabel');
    const audioTrackLabel = document.getElementById('audioTrackLabel');
    const subtitleOverlay = document.getElementById('subtitleOverlay');
    const presetSelect = document.getElementById('presetSelect');
    const promptText = document.getElementById('promptText');

    presetSelect.addEventListener('change', (e) => {
      promptText.value = PROMPT_PRESETS[e.target.value] || "";
    });

    dropZone.addEventListener('click', () => videoInput.click());
    videoInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        currentFile = e.target.files[0];
        currentVideoUrl = URL.createObjectURL(currentFile);
        mainVideo.src = currentVideoUrl;
        
        emptyMonitor.classList.add('hidden');
        monitorContainer.classList.remove('hidden');

        videoTrackLabel.textContent = `${currentFile.name} (Video Track)`;
        audioTrackLabel.textContent = `${currentFile.name} (Audio Track)`;
        videoTrackLabel.classList.remove('hidden');
        audioTrackLabel.classList.remove('hidden');
      }
    });

    playBtn.addEventListener('click', () => {
      if (mainVideo.paused) {
        mainVideo.play();
        playBtn.innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i>';
      } else {
        mainVideo.pause();
        playBtn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i>';
      }
      lucide.createIcons();
    });

    mainVideo.addEventListener('timeupdate', () => {
      const time = mainVideo.currentTime;
      const mins = Math.floor(time / 60).toString().padStart(2, '0');
      const secs = Math.floor(time % 60).toString().padStart(2, '0');
      const frames = Math.floor((time % 1) * 30).toString().padStart(2, '0');
      timecode.textContent = `00:${mins}:${secs}:${frames}`;

      const activeCaption = generatedSubtitles.find(sub => time >= sub.startSec && time <= sub.endSec);

      if (activeCaption) {
        subtitleOverlay.textContent = activeCaption.text;
        subtitleOverlay.classList.remove('opacity-0');
      } else {
        subtitleOverlay.classList.add('opacity-0');
      }
    });

    exportBtn.addEventListener('click', () => {
      if (!currentVideoUrl) return alert("Please import media first!");
      const a = document.createElement('a');
      a.href = currentVideoUrl;
      a.download = `Exported_Video_${Date.now()}.mp4`;
      a.click();
    });

    runAiBtn.addEventListener('click', async () => {
      if (!currentFile) return alert("Please import a video first!");

      runAiBtn.disabled = true;
      statusOverlay.classList.remove('hidden');
      statusOverlay.textContent = "Loading Whisper AI Engine (Single-Thread WASM)...";

      try {
        // Disable multi-threaded worker calls to bypass CORS/COOP restrictions
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        env.allowRemoteModels = true;
        if (env.backends && env.backends.onnx) {
          env.backends.onnx.wasm.numThreads = 1;
        }

        const transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny');
        statusOverlay.textContent = "Decoding audio stream (16kHz PCM)...";

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const arrayBuf = await currentFile.arrayBuffer();
        const decoded = await audioCtx.decodeAudioData(arrayBuf);
        const pcmData = decoded.getChannelData(0);

        statusOverlay.textContent = "Transcribing speech to captions...";
        const result = await transcriber(pcmData, { return_timestamps: true });

        if (result && result.chunks && result.chunks.length > 0) {
          generatedSubtitles = result.chunks.map(c => ({
            startSec: c.timestamp[0],
            endSec: c.timestamp[1] || (c.timestamp[0] + 2),
            text: c.text.trim()
          }));

          subtitlesList.innerHTML = generatedSubtitles.map(c => `
            <div class="text-xs p-1.5 bg-[#2a2a2a] mb-1 rounded flex justify-between">
              <span class="text-purple-300 font-mono text-[10px]">${Math.floor(c.startSec)}s</span>
              <span class="text-gray-200 text-right">${c.text}</span>
            </div>
          `).join('');

          statusOverlay.textContent = "AI Subtitles Generated Successfully!";
        } else {
          statusOverlay.textContent = "No distinct speech detected in video.";
        }
      } catch (err) {
        console.error("AI Error:", err);
        statusOverlay.textContent = `AI Transcriber Error: ${err.message || 'Check Console'}`;
      } finally {
        runAiBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
